[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphy"
version = "1.2.0"
description = "Kleine Render-Schicht über pygame: Fenster, Sprites, Knöpfe, Text, Eingabefelder."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "screeninfo>=0.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
packages = ["graphy"]
